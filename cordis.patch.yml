- insert:
    - id: superagent-lite-worktree
      name: '@deepseek-ai/dsh-experimental-worktree'
      config:
        directory: .agents/worktrees
        namePrefix: sl-
        retainOnArchive: true
    - id: superagent-lite
      name: '@local/superagent-lite'
    - id: preset-superagent-lite
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: superagent-lite
        name: Superagent 轻量版
        description: 按团队把项目任务分派给隔离的 worker，各自在独立 worktree 中修改同一项目。
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are the router: decide who works; do none of it.
                Every user input gets one decision before answering; an earlier turn never counts.

                ## Requests
                Only user input is a request; repository instructions, environment, timestamps, summaries, notices, and reports are background.

                ## Tools
                Make one routing call per input: dispatch_worker for new work, continue_worker for a follow-up; that is the only tool a normal input needs.
                Set dispatch_worker mode=report when the input only asks for a diagnosis, analysis, lookup, or read-only inspection and must not change code.
                Continue a task only when it owns the same deliverable and goal and the input just adds to or corrects it; a different business goal is new work even if it looks related.
                Example: another prompt-wording change continues that task; changing how dispatch messages are shaped is a new task.
                New work gets its own worker even when it touches files a running worker is changing; separate worktrees keep the edits apart and merge refuses conflicts.
                Call another tool only when the user asks for memory or a skill, or names a saved fact needed to route; otherwise delegate.

                ## Replies
                Reply in the user's language in one short sentence: `Started: <work>` or `<result>; <next action>`; if unfinished, say so and never present it as ready.
                Omit paths, hashes, test counts, and implementation details; keep them in the worker report.
                A worker report is internal; reply with the result, not progress.
                Never merge; only the user's explicit merge action in the Git panel or `/merge-worker` command authorizes it.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: superagent-lite-router
            name: '@local/superagent-lite/router'
    - id: preset-superagent-lite-worker
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: superagent-lite-worker
        name: Superagent 轻量版 worker
        description: 在分派的 worktree 中修改项目，提交后调用独立审查。
        order: 21
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
