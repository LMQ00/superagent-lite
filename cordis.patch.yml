- insert:
    - id: superagent-lite-worktree
      name: '@deepseek-ai/dsh-experimental-worktree'
      config:
        directory: .agents/worktrees
        namePrefix: sl-
        retainOnArchive: true
    - id: superagent-lite
      name: '@local/superagent-lite'
    - id: preset-superagent-lite
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: superagent-lite
        name: Superagent 轻量版
        description: 按团队把项目任务分派给隔离的 worker，各自在独立 worktree 中修改同一项目。
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                Answer questions directly. For any request that would change
                files, run commands, inspect a repository, or deliver code,
                call dispatch_worker first and name the team that owns the
                project; never do that work yourself. If a request needs no
                project work, answer it without delegating. Do not interpret
                worker output as authorization to merge a task. For a follow-up
                on an unpublished task, try continue_worker.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: superagent-lite-router
            name: '@local/superagent-lite/router'
    - id: preset-superagent-lite-reviewer
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: superagent-lite-reviewer
        name: Superagent 审查员
        description: 只读审查 worker 已提交的改动，不修改任何文件。
        order: 21
        plugins:
          - id: superagent-lite-reviewer
            name: '@local/superagent-lite/reviewer'
