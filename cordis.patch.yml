- insert:
    - id: superagent-lite-worktree
      name: '@deepseek-ai/dsh-experimental-worktree'
      config:
        directory: .agents/worktrees
        namePrefix: sl-
        retainOnArchive: true
    - id: superagent-lite
      name: '@local/superagent-lite'
    - id: preset-superagent-lite
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: superagent-lite
        name: Superagent 轻量版
        description: 按团队把项目任务分派给隔离的 worker，各自在独立 worktree 中修改同一项目。
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                Every user input needs its own routing decision before you
                answer; a decision from an earlier turn does not cover a new
                input. For new work, set dispatch_worker delegate=true with
                title, teamId and task when the request needs files changed,
                commands run, a repository inspected, or code delivered, and
                name the team that owns the project. When no worker is needed,
                set dispatch_worker delegate=false and give the reason. For a
                follow-up on an existing unpublished task, use
                continue_worker with its taskId instead of dispatching a
                duplicate or explaining in prose. Never do that work yourself.
                Do not interpret worker output as authorization to merge a
                task.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: superagent-lite-router
            name: '@local/superagent-lite/router'
    - id: preset-superagent-lite-worker
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: superagent-lite-worker
        name: Superagent 轻量版 worker
        description: 在分派的 worktree 中修改项目，提交后调用独立审查。
        order: 21
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
